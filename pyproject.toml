[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "registrydesk"
version = "0.3.0"
description = "Local desktop utility for importing CNAP property registry PDFs and exporting clean ownership workbooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "PyMuPDF>=1.26,<2",
    "openpyxl>=3.1,<4",
    "reportlab>=4.2,<5",
]

[project.scripts]
registrydesk = "registrydesk.runtime:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
registrydesk = ["resources/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
